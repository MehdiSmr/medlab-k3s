apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuma-deployment
  namespace: monitoring
  labels:
    app: uptime-kuma 
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime-kuma 
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      containers:
      - name: uptime-kuma 
        image: louislam/uptime-kuma:1.23.16
        ports:
        - containerPort: 3001
        livenessProbe:
          httpGet: { path: /, port: 3001 }
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet: { path: /, port: 3001 }
          periodSeconds: 10 
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi 
        volumeMounts:
        - name: uptime-kuma  
          mountPath: /app/data
      volumes:
      - name: uptime-kuma 
        persistentVolumeClaim:
          claimName: kuma-data 
