apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uptime-kuma
  namespace: argocd 
spec:
  project: default
  source:
    repoURL: https://github.com/MehdiSmr/medlab-k3s
    targetRevision: HEAD 
    path: apps/uptime-kuma 
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring 
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
